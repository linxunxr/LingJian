name: Release

# 推送 v* 格式的 tag 时触发发布。
# 仓库为公开，分发链路（v0.2.4 起，COS 已退役）：
#   构建 → 发 GitHub Release（产物留档 + 第二更新源）→ 同步 Gitee（国内主更新源）。
#   客户端 updater 端点顺序：Gitee → GitHub（v0.2.3 仍含 COS 末位，桶保留至存量用户迁移完）。
# 更新日志由 inject-changelog.mjs 从 CHANGELOG.md 提取，写入 latest.json 的 notes 字段。
on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: '--bundles nsis'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install dependencies (ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish
        # 固定到主干 commit：v0 标签（2026-03）不含 releaseAssetNamePattern
        # 支持，参数会被静默忽略导致 asset 名残缺（GitHub 要求完整 40 位 SHA）
        uses: tauri-apps/tauri-action@abbd19ad15b37f89667db9cc46ec1cb5419f22be
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 签名密钥（GitHub Secrets 中配置）
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: '灵鉴 ${{ github.ref_name }}'
          releaseBody: '请查看 Assets 下载对应平台的安装包。'
          releaseDraft: false
          prerelease: false
          # asset 命名模板：productName 是中文"灵鉴"，tauri-action 默认命名
          # 会经 ghAssetName 的 ASCII 清洗把它吞掉，得到残缺名（_0.2.2_x64-setup.exe）。
          # 显式模板绕过清洗；LingJian 为字面量前缀，[version]/[arch]/[ext] 取自构建信息，
          # [setup] 仅 NSIS 产物为 "-setup" 其他为空串，对齐 Tauri CLI 本地命名习惯。
          releaseAssetNamePattern: 'LingJian_[version]_[arch][setup][ext]'
          args: ${{ matrix.args }}

  # 上传 GitHub 兜底更新清单到 Release assets
  # （客户端 updater 第二端点经 releases/latest/download/latest.json 拉取）
  manifest-to-github:
    needs: publish
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download all release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          # 下载本次 Release 的所有 assets 到 dist/
          gh release download "${{ github.ref_name }}" \
            --repo linxunxr/LingJian \
            --dir dist \
            --clobber

      - name: Generate latest.json from assets
        run: node scripts/generate-latest-json.mjs dist "${{ github.ref_name }}"

      # latest.github.json 重命名为 latest.json 上传到 Release assets。
      # Gitee 清单（latest.gitee.json）由 sync-to-gitee job 负责提交，此处不上传。
      - name: Upload GitHub-fallback manifest to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p gh-manifest
          cp dist/latest.github.json gh-manifest/latest.json
          gh release upload "${{ github.ref_name }}" gh-manifest/latest.json \
            --repo linxunxr/LingJian --clobber

  # 同步发行版与更新清单到 Gitee（国内镜像 + updater 第二端点）
  #   - 发行版：tag + changelog + 安装包附件（API 创建 + attach_files 上传）
  #   - 更新清单：latest.gitee.json 提交到仓库根作 latest.json
  #     （Gitee 无 latest/download 固定地址，客户端经仓库 raw 地址拉取）
  # Gitee 仓库代码由其自带的 GitHub 镜像同步跟进，本 job 只补发行版与清单。
  # 令牌未配置（GITEE_TOKEN 缺失）时两个脚本均自动跳过，不阻断发布。
  sync-to-gitee:
    needs: publish
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download all release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          gh release download "${{ github.ref_name }}" \
            --repo linxunxr/LingJian \
            --dir dist \
            --clobber

      - name: Generate Gitee manifest
        run: node scripts/generate-latest-json.mjs dist "${{ github.ref_name }}"

      - name: Sync release and manifest to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: mwcxlinxun
          GITEE_REPO: ling-jian
        run: |
          # 清单提交失败不阻断（可在 Gitee 网页补更），发行版同步内部已做容错
          node scripts/sync-latest-to-gitee.mjs dist/latest.gitee.json || \
            echo '⚠ Gitee 清单提交失败（不阻断）'
          node scripts/sync-release-to-gitee.mjs dist "${{ github.ref_name }}"
