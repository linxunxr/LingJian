name: Release

# 推送 v* 格式的 tag 时触发发布。
# 仓库为公开，分发链路双源：
#   构建 → 发 GitHub Release（产物留档 + 兜底更新源）→ 镜像到腾讯云 COS（国内主更新源）。
# 更新日志由 inject-changelog.mjs 从 CHANGELOG.md 提取，写入 latest.json 的 notes 字段。
on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: '--bundles nsis'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install dependencies (ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 签名密钥（GitHub Secrets 中配置）
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: '灵鉴 ${{ github.ref_name }}'
          releaseBody: '请查看 Assets 下载对应平台的安装包。'
          releaseDraft: false
          prerelease: false
          # asset 命名模板：productName 是中文"灵鉴"，tauri-action 默认命名
          # 会经 ghAssetName 的 ASCII 清洗把它吞掉，得到残缺名（_0.2.2_x64-setup.exe）。
          # 显式模板绕过清洗；LingJian 为字面量前缀，[version]/[arch]/[ext] 取自构建信息，
          # [setup] 仅 NSIS 产物为 "-setup" 其他为空串，对齐 Tauri CLI 本地命名习惯。
          releaseAssetNamePattern: 'LingJian_[version]_[arch][setup][ext]'
          args: ${{ matrix.args }}

  # 构建完成后，同步所有产物到腾讯云 COS（国内加速）
  mirror-to-cos:
    needs: publish
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download all release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          # 下载本次 Release 的所有 assets 到 dist/
          gh release download "${{ github.ref_name }}" \
            --repo linxunxr/LingJian \
            --dir dist \
            --clobber

      - name: Generate latest.json from assets
        run: node scripts/generate-latest-json.mjs dist "${{ github.ref_name }}"

      # GitHub 兜底源：latest.github.json 重命名为 latest.json 上传到 Release
      # assets，客户端经 releases/latest/download/latest.json 拉取（updater
      # 第二端点）。上传后从 dist 移除，避免被下一步 COS 脚本重复上传。
      - name: Upload GitHub-fallback manifest to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p gh-manifest
          cp dist/latest.github.json gh-manifest/latest.json
          gh release upload "${{ github.ref_name }}" gh-manifest/latest.json \
            --repo linxunxr/LingJian --clobber
          rm dist/latest.github.json

      - name: Install COS Python SDK
        run: pip install cos-python-sdk-v5

      - name: Upload all assets to COS
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: lingjian-releases-1433733625
          COS_REGION: ap-guangzhou
        run: |
          # 用官方 SDK 上传（分块 + 断点续传 + 重试，针对跨洲链路加固）
          # 产物按版本归档到 /<version>/ 子目录，latest.json 留根目录
          python scripts/upload-to-cos.py dist "${{ github.ref_name }}"

  # 同步发行版到 Gitee（国内镜像：tag + changelog + 安装包附件全自动）
  # Gitee 仓库代码由其自带的 GitHub 镜像同步跟进，本 job 只补发行版。
  # 令牌未配置（GITEE_TOKEN 缺失）时脚本自动跳过，不阻断发布。
  sync-to-gitee:
    needs: publish
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download all release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          gh release download "${{ github.ref_name }}" \
            --repo linxunxr/LingJian \
            --dir dist \
            --clobber

      - name: Sync release to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: mwcxlinxun
          GITEE_REPO: ling-jian
        run: node scripts/sync-release-to-gitee.mjs dist "${{ github.ref_name }}"
