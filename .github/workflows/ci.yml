name: Test

# 分支级测试：push / PR 到 master 时跑后端单测 + 前端单测 + 类型检查与构建。
# 为 PR 合并提供检查依据（release.yml 仅 tag 触发，不覆盖日常分支）。
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Rust 单元测试
        working-directory: src-tauri
        run: cargo test --lib

      - name: 前端依赖
        run: npm ci

      - name: 前端单元测试
        run: npm test

      - name: 类型检查与构建
        run: npm run build
