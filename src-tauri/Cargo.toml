[package]
name = "lingjian"
version = "0.4.0"
edition = "2021"
license = "MIT"

[lib]
name = "lingjian_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-store = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
flate2 = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
regex = "1"
log = "0.4"
chrono = "0.4"
# keyring 3.x 平台后端是显式 feature、无默认值：不开会静默落 mock 后端
# （进程内 HashMap，写"成功"即丢）——7 月"钥匙串写入静默失败"的真相即此。
# 三平台按目标启用真实后端；Linux 用 sync-secret-service（桌面常见 Secret Service）。
keyring = { version = "3", features = [
    "windows-native",
    "apple-native",
    "sync-secret-service",
] }
uuid = { version = "1", features = ["v4"] }
rmcp = { version = "3.1.4", features = ["server", "macros", "transport-streamable-http-server"] }
axum = "0.8.9"
schemars = "1.2.2"
tokio = { version = "1.53.1", features = ["net"] }

[dev-dependencies]
tempfile = "3"
